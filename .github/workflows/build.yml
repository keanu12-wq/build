name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'URL ZIP Project'
        required: true
      tag_name:
        description: 'Tag Name'
        required: true
      build_type:
        description: 'Release / Debug'
        required: true
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Download Project ZIP
        run: |
          curl -L -o project.zip "${{ github.event.inputs.file_url }}"
          unzip -o project.zip -d project_app || echo "Warning unzip diabaikan, lanjut build!"

      - name: Get Dependencies
        run: |
          cd project_app
          flutter pub get

      - name: Fix Android Config & Plugins
        run: |
          cd project_app
          # 1. Hapus folder android lama (bersihin konflik settings.gradle)
          rm -rf android
          
          # 2. Generate ulang folder android pakai template Flutter 3.24
          flutter create --platforms=android --project-name project_app .
          
          # 3. Paksa SDK 35 di project lokal
          sed -i 's/compileSdkVersion .*/compileSdkVersion 35/' android/app/build.gradle
          sed -i 's/compileSdk .*/compileSdk 35/' android/app/build.gradle
          sed -i 's/targetSdkVersion .*/targetSdkVersion 35/' android/app/build.gradle
          sed -i 's/targetSdk .*/targetSdk 35/' android/app/build.gradle
          
          # 4. Paksa SDK 35 di cache plugin package_info_plus yang rewel
          find ~/.pub-cache -path "*package_info_plus*/android/build.gradle" -exec sed -i 's/flutter.compileSdkVersion/35/g' {} +
          find ~/.pub-cache -path "*flutter_plugin_android_lifecycle*/android/build.gradle" -exec sed -i 's/flutter.compileSdkVersion/35/g' {} +

      - name: Build APK
        run: |
          cd project_app
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-apk
          path: project_app/build/app/outputs/flutter-apk/*.apk
