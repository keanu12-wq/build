name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'URL ZIP Project'
        required: true
      tag_name:
        description: 'Tag Name'
        required: true
      build_type:
        description: 'Release / Debug'
        required: true
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Download Project ZIP
        run: |
          curl -L -o project.zip "${{ github.event.inputs.file_url }}"
          unzip -o project.zip -d project_app || echo "Warning unzip diabaikan, lanjut build!"

      - name: BRUTE FORCE GRADLE 8.14 & FIX PLUGINS
        run: |
          cd project_app
          
          # 1. CARI SEMUA file gradle-wrapper.properties dan paksa ganti ke 8.14
          find . -name "gradle-wrapper.properties" -exec sed -i 's/gradle-.*-all.zip/gradle-8.14-all.zip/' {} +
          find . -name "gradle-wrapper.properties" -exec sed -i 's/gradle-.*-bin.zip/gradle-8.14-bin.zip/' {} +
          
          # 2. Update font_awesome_flutter agar tidak error di Flutter baru
          sed -i 's/font_awesome_flutter: .*/font_awesome_flutter: ^10.12.0/' pubspec.yaml
          rm -f pubspec.lock
          
          # 3. Ambil dependensi ulang
          flutter pub get

      - name: Build APK
        run: |
          cd project_app
          # PAKAI FLAG BYPASS: Agar Flutter tidak ngecek versi Gradle lagi
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug --android-skip-build-dependency-validation
          else
            flutter build apk --release --android-skip-build-dependency-validation
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-apk
          path: project_app/build/app/outputs/flutter-apk/*.apk