name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'URL ZIP Project'
        required: true
      tag_name:
        description: 'Tag Name'
        required: true
      build_type:
        description: 'Release / Debug'
        required: true
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter (Kunci Versi 3.27.0)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.0' # Versi tengah-tengah, support CardThemeData tapi IconData belum final
          channel: 'stable'

      - name: Download Project ZIP
        run: |
          curl -L -o project.zip "${{ github.event.inputs.file_url }}"
          unzip -o project.zip -d project_app || echo "Warning unzip diabaikan, lanjut build!"

      - name: Fix Dependencies & Gradle
        run: |
          cd project_app
          
          # 1. Downgrade Font Awesome ke versi yang aman buat Flutter 3.27
          sed -i 's/font_awesome_flutter: .*/font_awesome_flutter: ^10.8.0/' pubspec.yaml
          rm -f pubspec.lock
          
          # 2. Paksa Gradle 8.9 (Syarat minimal Flutter 3.27)
          find . -name "gradle-wrapper.properties" -exec sed -i 's/gradle-.*-all.zip/gradle-8.9-all.zip/' {} +
          
          # 3. Get Deps
          flutter pub get

      - name: Build APK
        run: |
          cd project_app
          # Pake bypass flag biar Gradle anteng
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug --android-skip-build-dependency-validation
          else
            flutter build apk --release --android-skip-build-dependency-validation
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-apk
          path: project_app/build/app/outputs/flutter-apk/*.apk