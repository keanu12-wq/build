name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'URL ZIP Project'
        required: true
      tag_name:
        description: 'Tag Name'
        required: true
      build_type:
        description: 'Release / Debug'
        required: true
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Download Project ZIP
        run: |
          curl -L -o project.zip "${{ github.event.inputs.file_url }}"
          unzip -o project.zip -d project_app || echo "Warning unzip diabaikan, lanjut build!"

      - name: DOWNGRADE PLUGIN REWEL & FIX GRADLE
        run: |
          cd project_app
          
          # 1. TURUNIN VERSI PACKAGE_INFO_PLUS (Biang kerok Kotlin 2.2.0)
          # Kita paksa pakai versi 8.3.1 yang stabil dan support Kotlin lama
          sed -i 's/package_info_plus: .*/package_info_plus: ^8.3.1/' pubspec.yaml
          rm -f pubspec.lock
          
          # 2. Get dependencies ulang
          flutter pub get
          
          # 3. Sapu bersih cache plugin
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.compileSdkVersion/34/g' {} \;
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.targetSdkVersion/34/g' {} \;

          # 4. Bersihin folder android lama & Generate ulang
          rm -rf android
          flutter create --platforms=android --project-name project_app .
          
          # 5. TIMPA GRADLE KE VERSI 8.7
          echo "distributionBase=GRADLE_USER_HOME" > android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-all.zip" >> android/gradle/wrapper/gradle-wrapper.properties
          
          # 6. PAKSA KOTLIN KE 1.9.22 & SDK 34
          sed -i 's/id "org.jetbrains.kotlin.android" version ".*" apply false/id "org.jetbrains.kotlin.android" version "1.9.22" apply false/' android/settings.gradle
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/' android/app/build.gradle
          sed -i 's/compileSdk .*/compileSdk 34/' android/app/build.gradle
          sed -i 's/targetSdkVersion .*/targetSdkVersion 34/' android/app/build.gradle
          sed -i 's/targetSdk .*/targetSdk 34/' android/app/build.gradle
          
          chmod +x android/gradlew

      - name: Build APK
        run: |
          cd project_app
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-apk
          path: project_app/build/app/outputs/flutter-apk/*.apk