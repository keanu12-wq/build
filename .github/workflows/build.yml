name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'URL ZIP Project'
        required: true
      tag_name:
        description: 'Tag Name'
        required: true
      build_type:
        description: 'Release / Debug'
        required: true
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Download Project ZIP
        run: |
          curl -L -o project.zip "${{ github.event.inputs.file_url }}"
          unzip -o project.zip -d project_app || echo "Warning unzip diabaikan, lanjut build!"

      - name: Get Dependencies
        run: |
          cd project_app
          flutter pub get

      - name: Fix ALL Plugin Gradle SDK
        run: |
          # 1. SAPU BERSIH: Paksa semua plugin di cache pakai SDK 35
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.compileSdkVersion/35/g' {} \;
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.targetSdkVersion/35/g' {} \;
          find ~/.pub-cache -name "build.gradle" -exec sed -i 's/flutter.minSdkVersion/21/g' {} \;

          # 2. Bersihin folder android lama biar nggak konflik
          cd project_app
          rm -rf android
          
          # 3. Generate ulang folder android pakai template Flutter 3.24
          flutter create --platforms=android --project-name project_app .
          
          # 4. Paksa SDK 35 di project utama
          sed -i 's/compileSdkVersion .*/compileSdkVersion 35/' android/app/build.gradle
          sed -i 's/compileSdk .*/compileSdk 35/' android/app/build.gradle

      - name: Build APK
        run: |
          cd project_app
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-apk
          path: project_app/build/app/outputs/flutter-apk/*.apk
