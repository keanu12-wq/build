name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'URL ZIP Project'
        required: true
      tag_name:
        description: 'Tag Name'
        required: true
      build_type:
        description: 'Release / Debug'
        required: true
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Download Project ZIP
        run: |
          curl -L -o project.zip "${{ github.event.inputs.file_url }}"
          unzip -o project.zip -d project_app || echo "Warning unzip diabaikan, lanjut build!"

      - name: MAKSIMALIN GRADLE KE 8.14
        run: |
          cd project_app/android/gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-all.zip" >> gradle-wrapper.properties

      - name: FIX FONT AWESOME & GET DEPENDENCIES
        run: |
          cd project_app
          # Paksa upgrade font_awesome_flutter biar cocok sama Flutter baru
          sed -i 's/font_awesome_flutter: .*/font_awesome_flutter: ^10.9.0/' pubspec.yaml
          # Hapus pubspec.lock biar dia nyari versi terbaru
          rm -f pubspec.lock
          # Ambil dependensi ulang
          flutter pub get

      - name: Build APK
        run: |
          cd project_app
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug --android-skip-build-dependency-validation
          else
            flutter build apk --release --android-skip-build-dependency-validation
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-apk
          path: project_app/build/app/outputs/flutter-apk/*.apk