name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'URL ZIP Project'
        required: true
      tag_name:
        description: 'Tag Name'
        required: true
      build_type:
        description: 'Release / Debug'
        required: true
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Download Project ZIP
        run: |
          curl -L -o project.zip "${{ github.event.inputs.file_url }}"
          unzip -o project.zip -d project_app || echo "Warning unzip diabaikan, lanjut build!"

      - name: Force Gradle 8.14 & Fix FontAwesome
        run: |
          cd project_app
          
          # 1. Ganti versi Gradle langsung di file wrapper-nya
          sed -i 's/gradle-.*-all.zip/gradle-8.14-all.zip/' android/gradle/wrapper/gradle-wrapper.properties
          
          # 2. Update font_awesome_flutter biar support Flutter baru
          sed -i 's/font_awesome_flutter: .*/font_awesome_flutter: ^10.12.0/' pubspec.yaml
          rm -f pubspec.lock
          
          # 3. Ambil dependencies
          flutter pub get

      - name: Build APK
        run: |
          cd project_app
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-apk
          path: project_app/build/app/outputs/flutter-apk/*.apk